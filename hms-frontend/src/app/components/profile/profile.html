<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>My Profile</h3>

        </div>

        <div class="card-body">

            <form (ngSubmit)="updateProfile()">

                <div class="mb-3">

                    <label class="form-label">

                        Full Name

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="profile.fullName"
                        name="fullName">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Email

                    </label>

                    <input
                        type="email"
                        class="form-control"
                        [(ngModel)]="profile.email"
                        name="email">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Phone Number

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="profile.phoneNumber"
                        name="phoneNumber">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Username

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        [value]="profile.username"
                        readonly>

                </div>

                <button
                    class="btn btn-success">

                    Update Profile

                </button>

            </form>

        </div>

    </div>

</div>
