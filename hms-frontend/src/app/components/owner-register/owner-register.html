<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-dark text-white text-center">

                    <h3>Owner Registration</h3>

                </div>

                <div class="card-body">

                    <form (ngSubmit)="register()">

                        <div class="mb-3">
                            <label>Full Name</label>
                            <input class="form-control"
                                   name="fullName"
                                   [(ngModel)]="owner.fullName"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Username</label>
                            <input class="form-control"
                                   name="username"
                                   [(ngModel)]="owner.username"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email"
                                   class="form-control"
                                   name="email"
                                   [(ngModel)]="owner.email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Phone Number</label>
                            <input class="form-control"
                                   name="phoneNumber"
                                   [(ngModel)]="owner.phoneNumber"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Password</label>
                            <input type="password"
                                   class="form-control"
                                   name="password"
                                   [(ngModel)]="owner.password"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Confirm Password</label>
                            <input type="password"
                                   class="form-control"
                                   name="confirmPassword"
                                   [(ngModel)]="owner.confirmPassword"
                                   required>
                        </div>

                        <button class="btn btn-dark w-100">
                            Register Owner
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
