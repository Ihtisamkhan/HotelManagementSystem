<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3>Create Manager</h3>

                </div>

                <div class="card-body">

                    <form (ngSubmit)="createManager()">

                        <div class="mb-3">

                            <label>Full Name</label>

                            <input
                                class="form-control"
                                [(ngModel)]="manager.fullName"
                                name="fullName"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Username</label>

                            <input
                                class="form-control"
                                [(ngModel)]="manager.username"
                                name="username"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Email</label>

                            <input
                                type="email"
                                class="form-control"
                                [(ngModel)]="manager.email"
                                name="email"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Phone Number</label>

                            <input
                                class="form-control"
                                [(ngModel)]="manager.phoneNumber"
                                name="phoneNumber"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Password</label>

                            <input
                                type="password"
                                class="form-control"
                                [(ngModel)]="manager.password"
                                name="password"
                                required>

                        </div>

                        <button
                            class="btn btn-primary w-100">

                            Create Manager

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
