<div class="container mt-4">

    <h2>Assign Task</h2>

    <div class="mb-3">

        <label>Staff</label>

        <select
        class="form-select"
        [(ngModel)]="task.staffId">

            <option
            *ngFor="let staff of staffs"
            [value]="staff.id">

                {{staff.fullName}}

            </option>

        </select>

    </div>

    <div class="mb-3">

        <label>Room</label>

        <select
        class="form-select"
        [(ngModel)]="task.roomId">

            <option
            [value]="null">

                No Room

            </option>

            <option
            *ngFor="let room of rooms"
            [value]="room.roomId">

                {{room.roomNumber}}

            </option>

        </select>

    </div>

    <div class="mb-3">

    <div class="form-check">

        <input
            class="form-check-input"
            type="checkbox"
            [(ngModel)]="task.isMaintenanceTask">

        <label class="form-check-label">

            Maintenance Task

        </label>

    </div>

</div>

<div
    class="mb-3"
    *ngIf="task.isMaintenanceTask">

    <label>Maintenance Reason</label>

    <input
        class="form-control"
        [(ngModel)]="task.maintenanceReason">

</div>

    <div class="mb-3">

        <label>Task Title</label>

        <input
        class="form-control"
        [(ngModel)]="task.title">

    </div>

    <div class="mb-3">

        <label>Description</label>

        <textarea
        class="form-control"
        [(ngModel)]="task.description">

        </textarea>

    </div>

    <button
    class="btn btn-primary"
    (click)="assignTask()">

        Assign Task

    </button>

</div>
